#!/usr/bin/env ansible-playbook 
---
- name: Revert ESXi VM back to snapshot and powerOn with Prompt
  hosts: localhost
  vars:
    esxi_host: esxi1
  tasks:
  - name: loop virtual machines
    block:
      - ansible.builtin.set_fact:
          all_guest_names: []
      - name: Get virtual machine names
        community.vmware.vmware_vm_info:
          hostname: "{{ esxi_host }}"
          username: "{{ esxi_user }}"
          password: "{{ esxi_password }}"
          folder: ""
          validate_certs: no
        delegate_to: localhost
        register: vm_info
      - ansible.builtin.set_fact:
          all_guest_names: "{{ all_guest_names + [ item.guest_name ] }}"
        no_log: true
        loop: "{{ vm_info.virtual_machines | json_query(query) }}"
        vars:
          query: "[?guest_name]"

  - name: print all virtual machine names
    ansible.builtin.debug:
      msg: "{{ all_guest_names }}"

  - ansible.builtin.pause:
      prompt: "Name of VM"
      echo: yes
    register: vmname_input
  - ansible.builtin.set_fact:
      vmname: "{{ vmname_input.user_input }}"
  - name: Get VM Snapshots
    community.vmware.vmware_guest_snapshot_info:
      hostname: "{{ esxi_host }}"
      username: "{{ esxi_user }}"
      password: "{{ esxi_password }}"
      datacenter: ""
      folder: ""
      validate_certs: no
      name: "{{ vmname }}"
    register: snapshot_info
    delegate_to: localhost
  - ansible.builtin.debug: var=snapshot_info.guest_snapshots.snapshots
  - ansible.builtin.pause:
      prompt: "Snapshot name to revert into"
      echo: yes
    register: snapname_input
  - ansible.builtin.set_fact:
      snapname: "{{ snapname_input.user_input }}"
  - name: Revert Snapshot
    community.vmware.vmware_guest_snapshot:
      hostname: "{{ esxi_host }}"
      username: "{{ esxi_user }}"
      password: "{{ esxi_password }}"
      datacenter: ""
      folder: ""
      validate_certs: no
      name: "{{ vmname }}"
      state: revert
      snapshot_name: "{{ snapname }}"
      quiesce: yes
      memory_dump: yes
    delegate_to: localhost
  - name: Power on VM
    community.vmware.vmware_guest:
      hostname: "{{ esxi_host }}"
      username: "{{ esxi_user }}"
      password: "{{ esxi_password }}"
      validate_certs: no
      name: "{{ vmname }}"
      state: poweredon
    delegate_to: localhost

